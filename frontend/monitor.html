<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Monitor de Pagamentos - Dinheiro Carimbado</title>
  <link rel="stylesheet" href="monitor.css" />
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.9.0/dist/ethers.umd.min.js"></script>
</head>
<body>
  <header class="app-bar">
    <div class="left">
      <h1>📡 Pagamentos</h1>
      <div class="meta">
        <span class="chip" id="networkName">—</span>
        <span class="chip" id="contractAddress">—</span>
        <span class="chip">Bloco <span id="lastBlock">—</span></span>
      </div>
    </div>
    <div class="right">
      <input id="addrInput" placeholder="0x contrato" />
      <button id="saveAddr" title="Salvar endereço">💾</button>
      <button id="clearAddr" title="Limpar endereço">♻️</button>
      <button id="connectBtn" class="primary" title="Conectar">🔌 Conectar</button>
      <button id="backfillBtn" title="Carregar últimos">📥</button>
      <button id="clearBtn" title="Limpar log">🗑️</button>
      <div id="connectionStatus" class="status-dot offline"></div>
      <span id="statusText" class="status-text">Off</span>
    </div>
  </header>
  <main>
    <div id="eventsLog" class="events">
      <div class="placeholder">
        <div>📡</div>
        <p>Aguardando conexão...</p>
        <small>Informe e salve o endereço do contrato e clique Conectar</small>
      </div>
    </div>
  </main>
  <footer class="footer">Dinheiro Carimbado • Monitor de Pagamentos (PaidCompany)</footer>
  <script src="monitor.js"></script>
</body>
</html>
